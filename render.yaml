services:
  - type: web
    name: wowvisit-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
